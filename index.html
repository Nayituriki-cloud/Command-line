    <script>
      // Gracefully ignore Vite HMR WebSocket connection errors in cloud container preview
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e && e.reason ? (e.reason.message || e.reason) : '');
        if (str.includes('WebSocket') || str.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = String(e ? (e.message || '') : '');
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.preventDefault();
        }
      });
    </script>
